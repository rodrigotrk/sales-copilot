# Implantação na VPS (AD-004, AD-033): Postgres, servidor Spring e Caddy com o app web.
name: sales-copilot

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: salescopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?defina MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salescopilot"]
      interval: 5s
      retries: 20

  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/salescopilot
      APP_PASSWORD: ${APP_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?defina OPENROUTER_API_KEY}
      IMPORT_MODEL: ${IMPORT_MODEL:-anthropic/claude-sonnet-5.5}
      IMPORT_DIRECTORY: /data/imports
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - imports:/data/imports

  caddy:
    build: ../web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  imports:
  caddy-data:
  caddy-config:
