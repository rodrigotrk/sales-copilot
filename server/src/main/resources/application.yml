spring:
  application:
    name: server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salescopilot}
    username: app
    password: ${APP_PASSWORD:app}
  flyway:
    user: migrator
    password: ${MIGRATOR_PASSWORD:migrator}
    schemas: sales_copilot
    default-schema: sales_copilot
    create-schemas: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      # Sem tempo limite, um servidor de e-mail que não responde prende a requisição de login.
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    retry:
      max-attempts: 1
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:not-configured}
      timeout: 120s
      max-retries: 0
      chat:
        model: ${IMPORT_MODEL:anthropic/claude-sonnet-5.5}
        temperature: 0

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@localhost}
  import:
    directory: ${IMPORT_DIRECTORY:/var/lib/sales-copilot/imports}
    google-docs-base-url: https://docs.google.com
    scheduling-enabled: true
